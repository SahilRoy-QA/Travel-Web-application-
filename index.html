<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ILLUSION - Travel & Hotel Booking Platform</title>
    <meta name="description" content="Discover luxury stays, hotels, and holiday tour packages on ILLUSION with live availability, instant confirmation, and seamless booking." />

    <!-- Two <meta name="theme-color"> tags with media queries for seamless PWA & browser chrome support -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" id="meta-theme-color-light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1120" id="meta-theme-color-dark" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ILLUSION" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <meta property="og:title" content="ILLUSION - Travel & Hotel Booking Platform" />
    <meta property="og:description" content="Discover luxury stays, hotels, and holiday tour packages on ILLUSION with live availability, instant confirmation, and seamless booking." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Anti-Flash Theme Initializer: Runs synchronously before React renders -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('illusion_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && systemDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
